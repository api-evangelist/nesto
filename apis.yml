name: Nesto
kind: company
description: >-
  Nesto Inc. is a Montreal-headquartered Canadian digital mortgage lender
  and mortgage technology provider, founded in 2018 and licensed across Canadian
  jurisdictions. It sits on the financing side of the residential real estate value
  chain rather than the listings side — originating, underwriting, and servicing
  mortgages direct-to-consumer at nesto.ca, and, following its 2024 acquisition of
  CMLS Group, administering roughly CA$73 billion in residential and commercial
  mortgage assets. Its Nesto Cloud business (nestocloud.ca) sells the same
  origination, underwriting, and servicing platform to banks, credit unions, and
  commercial lenders as SaaS or fully outsourced BPO, and advertises "seamless API
  integrations with your existing systems and third-party providers" alongside a
  Maestro AI underwriting engine. That API surface is not publicly documented: there
  is no developer portal, no published reference, no OpenAPI or other machine-readable
  contract, and no self-serve signup. Access is a commercial engagement negotiated
  with the Nesto Cloud team. As a mortgage lender Nesto sits outside the listings
  syndication layer entirely — no RESO Web API or Data Dictionary certification, no
  RESO UPI usage, and no CREA Data Distribution Facility participation is published
  or discoverable. The company's only machine-readable public artifact is a
  security.txt whose disclosure scope explicitly names "Web applications, APIs, and
  customer-facing services", confirming APIs exist while none are documented for
  outside developers. Its compliance posture is, by contrast, published and audited —
  SOC 1 Type II, SOC 2 Type II and ISO 27001:2022 with a Vanta trust center — and its
  GitHub organization (nestoca) ships MIT-licensed developer-platform tooling such as
  the joy GitOps CLI, though no client SDK for any Nesto service.

aid: nesto
name: Nesto
review:
  question: Does Nesto publish a reachable public API surface, and what is its RESO
    posture as a Canadian real estate organization?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: mortgage-proptech
  summary: |
    Nesto publishes no developer portal, no API reference, and no machine-readable
    contract of any kind. Its B2B arm, Nesto Cloud, markets "seamless API
    integrations" as a platform capability but exposes no documentation, no signup,
    and no specification — access is a negotiated commercial engagement. Nesto is a
    mortgage lender and lending-platform vendor, not a listings platform, so it sits
    outside the CREA/DDF syndication layer and outside RESO entirely. No RESO
    certification, no OData $metadata, and no UPI reference exists anywhere on its
    properties.

sectorPosture:
  resoPosture:
    certified: false
    posture: no RESO reference found; mortgage lender outside the listings layer
    webApiCertification: none found
    dataDictionaryCertification: none found
    dataDictionaryVersion: null
    directoryEvidence: |
      No RESO certification of any kind was discoverable for Nesto. RESO is a
      North American MLS/listings standard driven by NAR membership; Nesto is a
      Canadian mortgage lender and lending-technology vendor and is not an MLS,
      board, listings portal, or IDX/VOW consumer. Searches across nesto.ca,
      nestocloud.ca, nestogroup.ca, and the open web returned zero mentions of
      RESO, Data Dictionary, Web API certification, or UPI.
    odataMetadataProbed: true
    odataMetadataFound: false
    upiReference: none found
    creaDdfParticipation: |
      No Canadian Real Estate Association Data Distribution Facility participation
      is published or discoverable. Nesto does not syndicate or consume REALTOR.ca
      listing data through any surface it documents. In Canada listings flow through
      CREA's single national DDF rather than ~500 US MLSs, and RESO adoption is
      correspondingly thin; Nesto's absence from that layer is structural, not a
      gap in publication.
    note: |
      Certification is not reachability, and here neither exists. This is the
      honest "RESO is absent" answer the sector study expects from a non-US,
      non-listings organization.

  accessGate:
    gate: partner-only
    gated: true
    whatADeveloperMustSignOrJoin: |
      There is no path for an unaffiliated developer. Nesto Cloud is sold as an
      enterprise SaaS or fully outsourced BPO engagement to financial institutions,
      credit unions, and commercial lenders. To reach any API a party must negotiate
      a commercial contract with the Nesto Cloud team — the published entry points
      are a "book a demo" form, info@nestocloud.ca, and 1.866.297.7407. No
      developer agreement, sandbox terms, rate card, or self-serve signup is
      published. Nesto Cloud also states it can "recommend certified integration
      partners", implying an implementation-partner program with no public roster
      or application process.
    selfServeSignupForAPIs: false
    consumerSignupNote: |
      app.nesto.ca (HTTP 200) is the consumer mortgage application login, not a
      developer console. It gates a borrower workflow, not API credentials.
    membershipRequired: false
    licenceAgreementRequired: false
    brokerOrAgentOnly: false

  openData:
    exists: false
    note: |
      Nesto publishes no open dataset. Its public rate tables are rendered as web
      pages under www.nesto.ca/mortgage-rates and are not offered as a licensed or
      unlicensed data product. Canada's land registration counterweight is
      provincial and largely privatised (Teranet operates Ontario's registry under
      concession), so no government open-data offset applies to this organization
      the way HM Land Registry Price Paid does in the UK.

  authModel:
    scheme: not published
    apiKey: unknown
    oauth2: unknown
    openIDConnect: false
    openIDConfigurationProbed: https://nesto.ca/.well-known/openid-configuration
    openIDConfigurationStatus: 404
    samlMemberPortal: unknown
    note: |
      No authentication scheme is documented for any Nesto API. The only
      authentication surface reachable anonymously is the consumer login at
      app.nesto.ca. Nesto Cloud markets SOC 2 Type II compliance and a
      "security-first architecture" for Canadian regulatory requirements, but
      publishes no auth documentation.

  webhooksEventsSdks:
    webhooks: none published
    events: none published
    sdks: none published
    postman: none published
    cli: none published
    note: |
      Absence is the finding. For a company selling an API-integrated lending
      platform, the complete lack of a public webhook catalogue, SDK, or Postman
      collection places the entire integration surface behind sales.

  productApiFamily:
    note: |
      Segmentation below reflects the product families Nesto's own marketing
      describes. None of these are documented as APIs — they are the platform
      capabilities behind which an undocumented API surface sits.
    families:
    - name: Mortgage origination and application intake
      documentedAsAPI: false
      source: https://nestocloud.ca/solutions/
    - name: Underwriting and decisioning (Maestro AI)
      documentedAsAPI: false
      source: https://nestocloud.ca/solutions/
    - name: Loan servicing and administration
      documentedAsAPI: false
      source: https://nestocloud.ca/solutions/
    - name: Unified input layer (credit reports, property details, documents,
        insurer responses, broker platforms)
      documentedAsAPI: false
      source: https://nestocloud.ca/solutions/
    - name: Rate comparison and rate hold (consumer)
      documentedAsAPI: false
      source: https://www.nesto.ca/
    - name: Renewals, refinancing, and HELOC
      documentedAsAPI: false
      source: https://www.nesto.ca/
    absentFromPortfolio:
    - Property listings / search
    - Valuation / AVM (as a published product)
    - Title / land registry
    - Property management / tenancy

findings:
  developerPortal:
    found: false
    url: ''
    confirmed: false
  machineReadableContracts:
    openapi: 0
    asyncapi: 0
    odataMetadata: 0
    graphql: 0
    total: 0
  notableArtifact:
    type: security.txt
    url: https://www.nesto.ca/.well-known/security.txt
    status: 200
    verbatimScope: |
      Scope:
      - Domains: *.nesto.ca
      - Web applications, APIs, and customer-facing services
    note: |
      A real, hand-written security.txt with Contact, Encryption, Canonical,
      Policy, Hiring, Preferred-Languages, Scope, and Disclosure fields. Its scope
      line is the only first-party written confirmation that Nesto operates APIs.
      No bug bounty is offered ("We might not send you a bounty").
  hostThatResolvesWithoutDocs:
    host: api.nesto.ca
    note: |
      api.nesto.ca resolves in DNS and answers, but every probed path returned 404
      and no contract is served. Treated as an undocumented internal host. It is
      deliberately NOT recorded as a baseURL in apis.yml — no documentation means
      no listed API.


scope_note: >-
  IMPORTANT — none of these are client libraries for a Nesto API. Nesto (GitHub org
  `nestoca`, 19 public repos) publishes no SDK for its mortgage, origination, underwriting,
  servicing or rates surfaces, because none of those surfaces is publicly documented.
  What the org does publish is a genuine, actively maintained set of first-party
  open-source DEVELOPER-PLATFORM tools — GitOps/Kubernetes deployment and scaffolding CLIs
  built for Nesto's own microservice estate and released publicly under MIT. They are
  catalogued here because they are real first-party packages, and because they are the only
  machine-consumable software Nesto ships. Registries probed with no first-party hit: npm
  (the `nesto` package on npm belongs to an unrelated author, `neilveil`), PyPI, Maven
  Central, NuGet, RubyGems (outside the org's own Homebrew tap), Packagist, crates.io.
